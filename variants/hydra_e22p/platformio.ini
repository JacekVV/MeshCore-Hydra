; Hydra: ESP32 DevKit + Ebyte E22P-868M30S (local variant, based on generic-e22).
; E22P: GPIO 14 = PA power, always HIGH (NOT RXEN), TXEN = GPIO 13 from the MCU, no DIO2 RF switch, reset = GPIO 23.
; Do not use the generic-e22 builds on Hydra: they toggle GPIO 14 as RXEN (wrong RF path on the E22P).
[Hydra_E22P]
extends = esp32_base
board = esp32doit-devkit-v1
build_flags =
  ${esp32_base.build_flags}
  -I variants/hydra_e22p
  -D HYDRA_E22P
  -D P_LORA_TX_LED=2
  -D PIN_VBAT_READ=35
  -D P_LORA_DIO_1=33
  -D P_LORA_NSS=18
  -D P_LORA_RESET=23
  -D P_LORA_BUSY=32
  -D P_LORA_SCLK=5
  -D P_LORA_MOSI=27
  -D P_LORA_MISO=19
  -D P_LORA_PA_POWER=14
  -D SX126X_TXEN=13
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=22
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=20   ; SX1262 setting, same as Meshtastic on the Hydras (tx_power 20, TX_GAIN_LORA 0)
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/hydra_e22p>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:Hydra_E22P_repeater]
extends = Hydra_E22P
build_src_filter = ${Hydra_E22P.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Hydra_E22P.build_flags}
  -D ADVERT_NAME='"Hydra Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"${sysenv.MESHCORE_ADMIN_PASSWORD}"'
  -D MAX_NEIGHBOURS=50
  -D FIRMWARE_VERSION='"v1.18.0-hydra-${sysenv.HYDRA_BUILD}"'
; OTA over the home Wi-Fi (HydraBoard), instead of the stock open "MeshCore-OTA" access point:
;   HYDRA_WIFI_SSID/PSK, HYDRA_OTA_PASSWORD (environment only), HYDRA_BUILD set by kompiluj.sh
  -D HYDRA_WIFI_OTA
; node list from adverts at http://<ip>/ (page) and /nodes (JSON), hook in examples/simple_repeater/MyMesh.cpp
  -D HYDRA_NODE_LIST
; read-only view of Public and hashtag channels (list in HydraChannels.cpp) at http://<ip>/kanal, hooks in simple_repeater/MyMesh.h
  -D HYDRA_CHANNELS
; packets to the LAN over UDP multicast 239.77.67.1:5600 (variants/hydra_e22p/HydraUdp.cpp).
; HYDRA_UDP_RX: the board also receives packets from the same group (injected into the local router, no LoRa retransmit).
  -D HYDRA_UDP
  -D HYDRA_UDP_RX
  -D DISABLE_WIFI_OTA
  -D WIFI_SSID='"${sysenv.HYDRA_WIFI_SSID}"'
  -D WIFI_PWD='"${sysenv.HYDRA_WIFI_PSK}"'
; fallback network, used alternately with the first one after 60 s without a connection
; disabled: the board stays on the RPi access point only (HydraBoard.cpp still supports WIFI_SSID2)
;  -D WIFI_SSID2='"${sysenv.HYDRA_WIFI_SSID2}"'
;  -D WIFI_PWD2='"${sysenv.HYDRA_WIFI_PSK2}"'
  -D HYDRA_OTA_PASSWORD='"${sysenv.HYDRA_OTA_PASSWORD}"'
lib_deps =
  ${Hydra_E22P.lib_deps}
  ${esp32_ota.lib_deps}

; Wi-Fi companion (app over TCP). SSID and password come from environment variables, never stored in files:
;   HYDRA_WIFI_SSID, HYDRA_WIFI_PSK
[env:Hydra_E22P_companion_radio_wifi]
extends = Hydra_E22P
build_flags =
  ${Hydra_E22P.build_flags}
  -D ENABLE_WIFI_INTERFACE
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D WIFI_SSID='"${sysenv.HYDRA_WIFI_SSID}"'
  -D WIFI_PWD='"${sysenv.HYDRA_WIFI_PSK}"'
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Hydra_E22P.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${Hydra_E22P.lib_deps}
  densaugeo/base64 @ ~1.4.0
