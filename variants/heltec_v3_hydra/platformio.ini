; Hydra: Heltec WiFi LoRa 32 V3 as a Wi-Fi companion radio with OTA updates (stock MeshCore companions have no OTA).
; Based on Heltec_v3_companion_radio_wifi, Heltec files unchanged. Secrets only from the environment (kompiluj.sh):
;   HYDRA_WIFI_SSID, HYDRA_WIFI_PSK (Wi-Fi), HYDRA_OTA_PASSWORD (http://<ip>/update, user admin), HYDRA_BUILD (version tag).
; The node name and other settings live in the device prefs and survive OTA.
[env:Heltec_v3_companion_wifi_hydra]
extends = env:Heltec_v3_companion_radio_wifi
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -I examples/companion_radio/ui-new
  -I variants/heltec_v3_hydra
  -D ENABLE_WIFI_INTERFACE
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D WIFI_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"Hydra Companion"'
  -D WIFI_SSID='"${sysenv.HYDRA_WIFI_SSID}"'
  -D WIFI_PWD='"${sysenv.HYDRA_WIFI_PSK}"'
  -D HYDRA_COMPANION_OTA
; second companion TCP port for the RPi (hydra-query); MultiSerialInterface sends every frame to both connections
  -D HYDRA_TCP_PORT2=5001
  -D HYDRA_OTA_PASSWORD='"${sysenv.HYDRA_OTA_PASSWORD}"'
  -D FIRMWARE_VERSION='"v1.18.0-hydra-heltec-${sysenv.HYDRA_BUILD}"'
build_src_filter = ${env:Heltec_v3_companion_radio_wifi.build_src_filter}
  +<../variants/heltec_v3_hydra>
lib_deps =
  ${env:Heltec_v3_companion_radio_wifi.lib_deps}
  ${esp32_ota.lib_deps}
